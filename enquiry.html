<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enquiry • RK KNIT FAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,sans-serif;}
    .glass{background:rgba(255,255,255,0.55);backdrop-filter:blur(16px);}    
  </style>
</head>
<body class="bg-gradient-to-br from-slate-200 via-white to-slate-100 min-h-screen p-6">

  <div class="max-w-xl mx-auto glass rounded-3xl p-6 shadow-xl border border-white/40">
    <h1 class="text-2xl font-extrabold mb-4">Enquiry</h1>
    <p class="text-slate-600 mb-6">Feel free to contact us for any product enquiry.</p>

    <div class="space-y-4">
      <div>
        <label class="text-sm font-semibold">Company Phone</label>
        <div id="phone" class="p-3 border rounded-xl bg-white mt-1"></div>
      </div>

      <div>
        <label class="text-sm font-semibold">Company Email</label>
        <div id="email" class="p-3 border rounded-xl bg-white mt-1"></div>
      </div>

      <div>
        <label class="text-sm font-semibold">Address</label>
        <div id="address" class="p-3 border rounded-xl bg-white mt-1"></div>
      </div>
    </div>

    <a href="index.html" class="mt-6 block text-center bg-black text-white p-3 rounded-xl">Back to Catalogue</a>
  </div>

<script>
const API = "https://script.google.com/macros/s/AKfycbywqAS_hZ4ht89pxUgZFb34vWIeufTp58jeO_-YmgAQGlUoUaB3Qzv4ixJYtXaiEoX3/exec";

async function load(){
  const res = await fetch(API + '?company=1');
  const j = await res.json();
  if(j.ok){
    phone.textContent = j.phone || 'Not provided';
    email.textContent = j.email || 'Not provided';
    address.textContent = j.address || 'Not provided';
  }
}
load();
</script>

</body>
</html>
