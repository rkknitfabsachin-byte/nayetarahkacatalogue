<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RK KNIT FAB • Catalogue</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
body { font-family: Inter, sans-serif; }
.glass { background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); }
.card { transition: 0.25s ease; }
.card:hover { transform: translateY(-4px); box-shadow: 0 20px 30px rgba(0,0,0,0.1); }
.fade { animation: fadeIn 0.6s ease forwards; opacity: 0; }
@keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-white to-slate-200 min-h-screen p-4">


<!-- HEADER -->
<header class="glass shadow-lg p-4 rounded-3xl max-w-5xl mx-auto mb-6 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-2xl bg-black text-white grid place-items-center text-xl font-bold">RK</div>
<div>
<h1 class="text-xl font-bold">RK KNIT FAB</h1>
<p id="companyEmail" class="text-xs text-slate-600"></p>
</div>
</div>
<div id="companyPhone" class="text-sm font-semibold"></div>
</header>


<!-- FILTER BAR -->
<section class="glass p-4 rounded-3xl max-w-5xl mx-auto shadow border border-white/40">
<div class="grid md:grid-cols-4 gap-4">
<input id="search" placeholder="Search products..." class="p-3 rounded-xl border" />
<select id="typeFilter" class="p-3 rounded-xl border"><option value="">All Types</option></select>
<select id="sortFilter" class="p-3 rounded-xl border">
<option value="new">Newest</option>
<option value="low">Price: Low → High</option>
<option value="high">Price: High → Low</option>
</select>
</div>
</section>


<!-- GRID -->
<div id="grid" class="max-w-5xl mx-auto mt-6 grid md:grid-cols-3 gap-6"></div>


<script>
const API = "https://script.google.com/macros/s/AKfycbywqAS_hZ4ht89pxUgZFb34vWIeufTp58jeO_-YmgAQGlUoUaB3Qzv4ixJYtXaiEoX3/exec";


async function loadCatalogue(){
const res = await fetch(API);
const data = await res.json();
const products = data.products;


// Fill types
const types = [...new Set(products.map(p=>p.type).filter(Boolean))];
const typeSel = document.getElementById("typeFilter");
types.forEach(t => typeSel.innerHTML += `<option value="${t}">${t}</option>`);


window.allProducts = products;
render();
</html>
