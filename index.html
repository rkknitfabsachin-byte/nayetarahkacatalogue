<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 p-6">

<h1 class="text-3xl font-bold mb-6 text-center">Product Catalogue</h1>

<div id="grid" class="grid md:grid-cols-3 gap-6"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbywqAS_hZ4ht89pxUgZFb34vWIeufTp58jeO_-YmgAQGlUoUaB3Qzv4ixJYtXaiEoX3/exec"; 

async function load(){
  const res = await fetch(API);
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = data.products.map(p => card(p)).join("");
}

function card(p){
  return `
    <div class="bg-white shadow rounded-xl p-3">
      <img src="${p.mediaUrl}" class="w-full h-48 object-cover rounded-lg" />
      <h2 class="text-lg font-semibold mt-2">${p.name}</h2>
      <p class="text-slate-600 text-sm">${p.description}</p>
      <div class="mt-1 text-sm font-bold text-black">₹ ${p.price}</div>
      <div class="mt-1 text-xs text-slate-500">${p.type}</div>
    </div>
  `;
}

load();
</script>

</body>
</html>
