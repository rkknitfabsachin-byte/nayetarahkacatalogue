<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RK KNIT FAB • Premium Catalogue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{ --glass: rgba(255,255,255,0.6); --blur: 14px; }
    body{ font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .glass{ background: var(--glass); backdrop-filter: blur(var(--blur)); }
    .card{ transition: transform .25s ease, box-shadow .25s ease, opacity .2s }
    .card:hover{ transform: translateY(-6px) scale(1.01); box-shadow: 0 20px 40px rgba(0,0,0,.12) }
    .fade{ animation: fadeIn .5s ease both }
    @keyframes fadeIn{ from{ opacity:.0; transform: translateY(8px) } to{ opacity:1; transform:none } }
    .clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
    .clamp-3{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden }
    .skeleton{ background: linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 37%,#e5e7eb 63%); background-size: 400% 100%; animation: shimmer 1.2s ease-in-out infinite; }
    @keyframes shimmer{ 0%{background-position: 100% 0} 100%{background-position: 0 0} }
    .chip{ border: 1px solid rgba(255,255,255,.6); }
    /* modal scroll lock */
    .no-scroll{ overflow: hidden; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-200 via-white to-slate-100 min-h-screen">

  <!-- Header -->
  <header class="glass sticky top-0 z-30 border-b border-white/50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Logo" class="w-11 h-11 rounded-2xl shadow object-cover" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 120\"%3E%3Crect width=\"120\" height=\"120\" rx=\"24\" fill=\"%23000\"/%3E%3Ctext x=\"50%25\" y=\"55%25\" dominant-baseline=\"middle\" text-anchor=\"middle\" font-size=\"42\" fill=\"white\" font-family=\"Inter,Arial\"%3ERK%3C/text%3E%3C/svg%3E'" />
        <div>
          <h1 class="text-xl md:text-2xl font-extrabold tracking-tight">RK KNIT FAB</h1>
          <p id="companyEmail" class="text-xs text-slate-600"></p>
        </div>
      </div>
      <div id="companyPhone" class="text-sm md:text-base font-semibold"></div>
    </div>
  </header>

  <!-- Filters -->
  <section class="max-w-7xl mx-auto px-4 mt-5">
    <div class="glass rounded-3xl p-4 md:p-5 shadow border border-white/50">
      <div class="grid gap-3 md:grid-cols-5 items-end">
        <div class="md:col-span-2">
          <label class="text-xs font-semibold text-slate-600">Search</label>
          <input id="search" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200" placeholder="Search name or description" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Type</label>
          <select id="typeFilter" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200">
            <option value="">All</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Sort</label>
          <select id="sortFilter" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200">
            <option value="new">Newest</option>
            <option value="low">Price: Low → High</option>
            <option value="high">Price: High → Low</option>
            <option value="name">Name A → Z</option>
          </select>
        </div>
        <button id="clearBtn" class="px-4 py-2 rounded-xl border border-slate-300">Clear</button>
      </div>

      <!-- Category chips -->
      <div id="chips" class="mt-4 flex gap-2 overflow-x-auto pb-1"></div>
    </div>
  </section>

  <!-- Grid -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- skeletons -->
      <div class="glass rounded-3xl p-4 border border-white/50 skeleton h-72"></div>
      <div class="glass rounded-3xl p-4 border border-white/50 skeleton h-72"></div>
      <div class="glass rounded-3xl p-4 border border-white/50 skeleton h-72"></div>
    </div>
  </main>

  <!-- Floating WhatsApp button -->
  <a id="whBtn" href="#" target="_blank" class="fixed bottom-5 right-5 bg-green-500 text-white rounded-full shadow-lg px-5 py-3 text-sm md:text-base hidden">WhatsApp</a>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
    <div class="relative max-w-3xl mx-auto mt-10 md:mt-16 p-0">
      <article class="glass rounded-3xl overflow-hidden shadow-xl border border-white/50">
        <div id="modalMedia" class="w-full h-72 md:h-[420px] bg-black/5"></div>
        <div class="p-4 md:p-6">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 id="mName" class="text-xl md:text-2xl font-extrabold"></h3>
              <div id="mType" class="text-xs md:text-sm text-slate-500 mt-1"></div>
            </div>
            <button class="px-3 py-1 rounded-xl border" onclick="closeModal()">Close</button>
          </div>
          <p id="mDesc" class="mt-2 text-slate-700"></p>
          <div class="mt-3 flex items-center justify-between">
            <div id="mPrice" class="text-lg md:text-xl font-bold"></div>
            <div class="flex gap-2">
              <a id="mWhats" target="_blank" class="px-4 py-2 rounded-xl bg-green-500 text-white">WhatsApp</a>
              <button id="mCopy" class="px-4 py-2 rounded-xl border">Copy Link</button>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>

  <footer class="text-center text-xs text-slate-500 pb-8">© <span id="yr"></span> RK KNIT FAB — All rights reserved.</footer>

<script>
  const API = "https://script.google.com/macros/s/AKfycbywqAS_hZ4ht89pxUgZFb34vWIeufTp58jeO_-YmgAQGlUoUaB3Qzv4ixJYtXaiEoX3/exec"; // e.g. https://script.google.com/macros/s/AKfycb.../exec

  // Demo data: gets used if API has no data yet (so site looks rich from day one)
  const DEMO = [
    {id:1,name:"SuperSoft Fleece Hoodie",description:"Ultra-comfy fleece with premium knit.",type:"Hoodie",price:1299,mediaUrl:"https://images.unsplash.com/photo-1520975922284-9bcd881487c1?q=80&w=1200&auto=format&fit=crop"},
    {id:2,name:"Cotton Crew T-Shirt",description:"Breathable 100% cotton daily wear.",type:"T-Shirt",price:399,mediaUrl:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=1200&auto=format&fit=crop"},
    {id:3,name:"Classic Knit Beanie",description:"Warm beanie with tight knit.",type:"Accessories",price:249,mediaUrl:"https://images.unsplash.com/photo-1614252369475-a5795a1f5111?q=80&w=1200&auto=format&fit=crop"},
    {id:4,name:"Activewear Joggers",description:"Stretch joggers for everyday movement.",type:"Bottoms",price:899,mediaUrl:"https://images.unsplash.com/photo-1520975661595-645c1121f49a?q=80&w=1200&auto=format&fit=crop"},
    {id:5,name:"Zip-Up Sports Jacket",description:"Lightweight jacket with smooth zip.",type:"Jacket",price:1799,mediaUrl:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=1200&auto=format&fit=crop"},
    {id:6,name:"Premium Knit Scarf",description:"Soft-touch long scarf with luxe feel.",type:"Accessories",price:349,mediaUrl:"https://images.unsplash.com/photo-1606760227091-3dd870d97d7d?q=80&w=1200&auto=format&fit=crop"}
  ];

  let ALL = [];

  async function init(){
    document.getElementById('yr').textContent = new Date().getFullYear();
    await loadCompany();
    await loadProducts();
    attachEvents();
  }

  async function loadCompany(){
    try{
      const r = await fetch(API + '?company=1');
      const j = await r.json();
      if(j && j.ok){
        document.getElementById('companyPhone').textContent = j.phone || '';
        document.getElementById('companyEmail').textContent = j.email || '';
        // WhatsApp floating button default
        if(j.phone){
          const w = document.getElementById('whBtn');
          w.href = 'https://wa.me/' + j.phone.replace(/[^0-9]/g,'');
          w.classList.remove('hidden');
        }
      }
    }catch(err){ /* ignore */ }
  }

  async function loadProducts(){
    let ok = false, items = [];
    try{
      const r = await fetch(API);
      const j = await r.json();
      if(j && j.ok && Array.isArray(j.products)){
        items = j.products;
        ok = true;
      }
    }catch(e){ ok = false }

    if(!ok || !items.length){ items = DEMO; }

    ALL = items;
    buildTypeOptions();
    buildChips();
    render();
  }

  function buildTypeOptions(){
    const sel = document.getElementById('typeFilter');
    const set = Array.from(new Set(ALL.map(p => p.type).filter(Boolean))).sort();
    for(const t of set){ const o = document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o); }
  }

  function buildChips(){
    const wrap = document.getElementById('chips'); wrap.innerHTML = '';
    const types = Array.from(new Set(ALL.map(p => p.type).filter(Boolean))).sort();
    const mk = (label,val)=>{
      const b = document.createElement('button');
      b.className = 'chip px-3 py-1 rounded-full glass text-sm';
      b.textContent = label; b.onclick = ()=>{ document.getElementById('typeFilter').value = val; render(); };
      return b;
    };
    wrap.appendChild(mk('All',''));
    types.forEach(t=> wrap.appendChild(mk(t,t)));
  }

  function attachEvents(){
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('typeFilter').addEventListener('change', render);
    document.getElementById('sortFilter').addEventListener('change', render);
    document.getElementById('clearBtn').addEventListener('click', ()=>{
      document.getElementById('search').value='';
      document.getElementById('typeFilter').value='';
      document.getElementById('sortFilter').value='new';
      render();
    });
    document.getElementById('mCopy').addEventListener('click', ()=>{
      if(window._currentLink){ navigator.clipboard.writeText(window._currentLink); alert('Link copied'); }
    });
  }

  function isVideo(url){
    const u = (url||'').toLowerCase();
    return u.endsWith('.mp4') || u.endsWith('.webm') || u.startsWith('data:video');
  }

  function render(){
    const q = document.getElementById('search').value.trim().toLowerCase();
    const t = document.getElementById('typeFilter').value;
    const s = document.getElementById('sortFilter').value;

    let list = ALL.filter(p => {
      const inQ = (String(p.name||'').toLowerCase().includes(q) || String(p.description||'').toLowerCase().includes(q));
      const inT = !t || String(p.type||'') === t;
      return inQ && inT;
    });

    if(s==='new'){ list.sort((a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0)); }
    if(s==='low'){ list.sort((a,b)=> (parseFloat(a.price||0)||0) - (parseFloat(b.price||0)||0)); }
    if(s==='high'){ list.sort((a,b)=> (parseFloat(b.price||0)||0) - (parseFloat(a.price||0)||0)); }
    if(s==='name'){ list.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''))); }

    const grid = document.getElementById('grid');
    grid.innerHTML = list.map(p => card(p)).join('');
  }

  function card(p){
    const media = isVideo(p.mediaUrl)
      ? `<video class="w-full h-56 object-cover rounded-2xl" src="${p.mediaUrl}" controls muted playsinline></video>`
      : `<img class="w-full h-56 object-cover rounded-2xl" src="${p.mediaUrl}" alt="${escapeHtml(p.name||'')}">`;
    const wp = `https://wa.me/` + (document.getElementById('companyPhone').textContent||'').replace(/[^0-9]/g,'') + `?text=` + encodeURIComponent(`Hi, I'm interested in ${p.name} (₹ ${p.price}).`);
    return `
      <article class="glass card rounded-3xl p-3 border border-white/50 fade" onclick='openModal(${JSON.stringify(p).split("'").join("&apos;")})'>
        <div class="rounded-2xl overflow-hidden">${media}</div>
        <div class="p-3">
          <div class="flex items-center justify-between gap-3">
            <h3 class="text-lg font-bold clamp-2">${p.name||'Untitled'}</h3>
            <div class="text-sm font-semibold whitespace-nowrap">₹ ${Number(p.price||0).toLocaleString('en-IN')}</div>
          </div>
          <p class="text-sm text-slate-600 clamp-2 mt-1">${p.description||''}</p>
          <div class="mt-2 text-xs text-slate-500">${p.type||''}</div>
          <a href="${wp}" target="_blank" class="mt-3 inline-block text-xs px-3 py-1 rounded-xl bg-green-500 text-white">Enquire on WhatsApp</a>
        </div>
      </article>`;
  }

  function openModal(p){
    const modal = document.getElementById('modal');
    const mMedia = document.getElementById('modalMedia');
    const name = document.getElementById('mName');
    const type = document.getElementById('mType');
    const desc = document.getElementById('mDesc');
    const price = document.getElementById('mPrice');
    const whats = document.getElementById('mWhats');

    name.textContent = p.name||'';
    type.textContent = p.type||'';
    desc.textContent = p.description||'';
    price.textContent = '₹ ' + Number(p.price||0).toLocaleString('en-IN');

    const phone = (document.getElementById('companyPhone').textContent||'').replace(/[^0-9]/g,'');
    const link = 'https://wa.me/' + phone + '?text=' + encodeURIComponent('I am interested in ' + (p.name||'') + ' (₹ ' + (p.price||'') + ').');
    window._currentLink = location.href.split('#')[0];
    whats.href = link;

    mMedia.innerHTML = isVideo(p.mediaUrl)
      ? `<video class="w-full h-full object-cover" src="${p.mediaUrl}" controls autoplay muted playsinline></video>`
      : `<img class="w-full h-full object-cover" src="${p.mediaUrl}" alt="${escapeHtml(p.name||'')}">`;

    modal.classList.remove('hidden');
    document.body.classList.add('no-scroll');
  }

  function closeModal(){
    document.getElementById('modal').classList.add('hidden');
    document.body.classList.remove('no-scroll');
  }

  function escapeHtml(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
