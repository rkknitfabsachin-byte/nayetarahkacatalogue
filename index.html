<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RK KNIT FAB • Premium Catalogue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{ --glass: rgba(255,255,255,0.6); --blur: 14px; }
    body{ font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .glass{ background: var(--glass); backdrop-filter: blur(var(--blur)); }
    .card{ transition: transform .25s ease, box-shadow .25s ease, opacity .2s }
    .card:hover{ transform: translateY(-6px) scale(1.01); box-shadow: 0 20px 40px rgba(0,0,0,.12) }
    .fade{ animation: fadeIn .5s ease both }
    @keyframes fadeIn{ from{ opacity:.0; transform: translateY(8px) } to{ opacity:1; transform:none } }
    .clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
    .no-scroll{ overflow: hidden; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-200 via-white to-slate-100 min-h-screen">

  <!-- Header -->
  <header class="glass sticky top-0 z-30 border-b border-white/50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Logo" class="w-11 h-11 rounded-2xl shadow object-cover" />
        <div>
          <h1 class="text-xl md:text-2xl font-extrabold tracking-tight">RK KNIT FAB</h1>
          <p id="companyEmail" class="text-xs text-slate-600"></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="enquiry.html" class="hidden md:inline-block px-4 py-2 rounded-xl border border-slate-300">Enquiry</a>
        <span id="companyPhone" class="text-sm md:text-base font-semibold"></span>
      </div>
    </div>
  </header>

  <!-- Filters -->
  <section class="max-w-7xl mx-auto px-4 mt-5">
    <div class="glass rounded-3xl p-4 md:p-5 shadow border border-white/50">
      <div class="grid gap-3 md:grid-cols-5 items-end">
        <div class="md:col-span-2">
          <label class="text-xs font-semibold text-slate-600">Search</label>
          <input id="search" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200" placeholder="Search products" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Type</label>
          <select id="typeFilter" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200">
            <option value="">All</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Sort</label>
          <select id="sortFilter" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200">
            <option value="new">Newest</option>
            <option value="low">Price Low → High</option>
            <option value="high">Price High → Low</option>
            <option value="name">Name A → Z</option>
          </select>
        </div>
        <a href="enquiry.html" class="md:hidden px-4 py-2 rounded-xl border border-slate-300 text-center">Enquiry</a>
      </div>
    </div>
  </section>

  <!-- Grid -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
    <div class="relative max-w-3xl mx-auto mt-10 md:mt-16 p-0">
      <article class="glass rounded-3xl overflow-hidden shadow-xl border border-white/50">
        <div id="modalMedia" class="w-full h-72 md:h-[420px] bg-black/5"></div>
        <div class="p-4 md:p-6">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 id="mName" class="text-xl md:text-2xl font-extrabold"></h3>
              <div id="mType" class="text-xs md:text-sm text-slate-500 mt-1"></div>
            </div>
            <button class="px-3 py-1 rounded-xl border" onclick="closeModal()">Close</button>
          </div>
          <p id="mDesc" class="mt-2 text-slate-700"></p>
          <div class="mt-3 flex items-center justify-between">
            <div id="mPrice" class="text-lg md:text-xl font-bold"></div>
            <a href="enquiry.html" class="px-4 py-2 rounded-xl bg-blue-600 text-white">Enquiry</a>
          </div>
        </div>
      </article>
    </div>
  </div>

  <footer class="text-center text-xs text-slate-500 pb-8">© <span id="yr"></span> RK KNIT FAB — All rights reserved.</footer>

<script>
  const API = "https://companycatalogue-12.rkknitfabsachin.workers.dev/";

  async function init(){
    document.getElementById('yr').textContent = new Date().getFullYear();
    await loadCompany();
    await loadProducts();
    attachEvents();
  }

  async function loadCompany(){
    try{
      const r = await fetch(API + '?company=1');
      const j = await r.json();
      if(j.ok){
        companyPhone.textContent = j.phone || '';
        companyEmail.textContent = j.email || '';
      }
    }catch(err){ /* ignore */ }
  }

  let ALL = [];

  async function loadProducts(){
    try{
      const r = await fetch(API);
      const j = await r.json();
      ALL = j.products || [];
      buildTypeOptions();
      render();
    }catch(err){ ALL = []; render(); }
  }

  function buildTypeOptions(){
    const sel = document.getElementById('typeFilter');
    sel.innerHTML = '<option value="">All</option>';
    const set = Array.from(new Set((ALL||[]).map(p => p.type).filter(Boolean))).sort();
    for(const t of set){ const o = document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o); }
  }

  function attachEvents(){
    search.oninput = render;
    typeFilter.onchange = render;
    sortFilter.onchange = render;
  }

  function isVideo(url){ 
    const u = (url||'').toLowerCase();
    return u.endsWith('.mp4') || u.endsWith('.webm') || u.startsWith('data:video'); 
  }

  function render(){
    let q = (search.value||'').toLowerCase();
    let t = typeFilter.value;
    let s = sortFilter.value;

    let list = (ALL||[]).filter(p =>
      (!q || (String(p.name||'').toLowerCase().includes(q) || String(p.description||'').toLowerCase().includes(q))) &&
      (!t || String(p.type||'') === t)
    );

    if(s==='low') list.sort((a,b)=> (parseFloat(a.price||0)||0) - (parseFloat(b.price||0)||0));
    if(s==='high') list.sort((a,b)=> (parseFloat(b.price||0)||0) - (parseFloat(a.price||0)||0));
    if(s==='name') list.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||'')));

    grid.innerHTML = list.map(p => card(p)).join('');
  }

  function card(p){
    const media = isVideo(p.mediaUrl)
      ? `<video class='w-full h-56 object-cover rounded-2xl' src='${p.mediaUrl}' controls muted playsinline></video>`
      : `<img class='w-full h-56 object-cover rounded-2xl' src='${p.mediaUrl}' alt='${escapeHtml(p.name||"")}'/>`;
    return `
      <article class='glass card rounded-3xl p-3 border border-white/50 fade' onclick='openModal(${JSON.stringify(p).split("'\").join("&apos;")})'>
        <div class='rounded-2xl overflow-hidden'>${media}</div>
        <div class='p-3'>
          <h3 class='text-lg font-bold clamp-2'>${p.name||''}</h3>
          <p class='text-sm text-slate-600 clamp-2 mt-1'>${p.description||''}</p>
          <div class='mt-2 text-xs text-slate-500'>${p.type||''}</div>
          <a href='enquiry.html' class='mt-3 inline-block text-xs px-3 py-1 rounded-xl bg-blue-600 text-white'>Enquiry</a>
        </div>
      </article>`;
  }

  function openModal(p){
    mName.textContent = p.name||'';
    mType.textContent = p.type||'';
    mDesc.textContent = p.description||'';
    mPrice.textContent = "₹ " + (p.price||'');
    modalMedia.innerHTML = isVideo(p.mediaUrl)
      ? `<video class='w-full h-full object-cover' src='${p.mediaUrl}' controls autoplay muted playsinline></video>`
      : `<img class='w-full h-full object-cover' src='${p.mediaUrl}' alt='${escapeHtml(p.name||"")}'/>`;
    modal.classList.remove('hidden');
    document.body.classList.add('no-scroll');
  }

  function closeModal(){
    modal.classList.add('hidden');
    document.body.classList.remove('no-scroll');
  }

  function escapeHtml(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
