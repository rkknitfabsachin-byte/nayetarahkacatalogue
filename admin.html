<!DOCTYPE html>
<h1 class="text-2xl font-bold mb-4">Admin Panel</h1>
<p class="text-slate-600 mb-4">Add products + manage company details</p>


<div class="max-w-xl bg-white p-5 rounded-2xl shadow-xl border border-slate-200">
<!-- Admin Key -->
<div class="mb-4">
<label class="font-semibold">Admin Key</label>
<input id="adminKey" type="password" class="w-full p-2 border rounded mt-1" placeholder="Enter admin key" />
</div>


<h2 class="font-bold text-lg mb-2">Company Details</h2>
<input id="companyPhone" class="p-2 border rounded w-full mb-2" placeholder="Phone" />
<input id="companyEmail" class="p-2 border rounded w-full mb-4" placeholder="Email" />
<button onclick="saveCompany()" class="p-3 bg-blue-600 text-white rounded-xl w-full mb-6">Save Company Details</button>


<h2 class="font-bold text-lg mb-2">Add Product</h2>
<input id="name" class="p-2 border rounded w-full mb-2" placeholder="Product Name" />
<textarea id="description" class="p-2 border rounded w-full mb-2" placeholder="Description"></textarea>
<input id="type" class="p-2 border rounded w-full mb-2" placeholder="Type" />
<input id="price" type="number" class="p-2 border rounded w-full mb-2" placeholder="Price" />
<input id="mediaUrl" class="p-2 border rounded w-full mb-4" placeholder="Google Drive Image Link" />


<button onclick="addProduct()" class="p-3 bg-black text-white rounded-xl w-full">Add Product</button>
</div>


<script>
const API = "https://script.google.com/macros/s/AKfycbywqAS_hZ4ht89pxUgZFb34vWIeufTp58jeO_-YmgAQGlUoUaB3Qzv4ixJYtXaiEoX3/exec";


function driveToDirect(url){
try { const id = url.match(/[-\w]{25,}/)[0]; return `https://drive.google.com/uc?export=view&id=${id}`; }
catch { return url; }
}


async function addProduct(){
const key = adminKey.value.trim();
if(!key) return alert("Admin key required");


const data = new URLSearchParams({
adminKey: key,
name: name.value,
description: description.value,
type: type.value,
price: price.value,
mediaUrl: driveToDirect(mediaUrl.value)
});


const res = await fetch(API, { method:"POST", body:data });
const json = await res.json();
if(json.ok) alert("Product added!"); else alert(json.error);
}


async function saveCompany(){
const key = adminKey.value;
if(!key) return alert("Admin key required");


const data = new URLSearchParams({
adminKey: key,
phone: companyPhone.value,
email: companyEmail.value,
updateCompany: "1"
});


const res = await fetch(API, { method:"POST", body:data });
const j = await res.json();


if(j.ok) alert("Company details saved");
else alert(j.error);
}
</script>


</body>
</html>
